[package]
name = "slop-machines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tracing.workspace = true
httparse = "1"
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1", features = ["derive"] }
