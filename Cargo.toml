[workspace]
members = ["apps/agentd", "apps/machined", "crates/machines", "crates/process"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "process", "io-util", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
