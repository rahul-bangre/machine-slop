name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - run: make setup
      - run: make check
      - run: make test
      - run: deno task bench:chromium
      - run: deno task test:browser-agent
      - run: make build
