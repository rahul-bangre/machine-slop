<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fork the agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=block"
      rel="stylesheet">
    <style>
    :root {
      --bg: #0b0d12;
      --panel: #12151d;
      --panel2: #171b25;
      --line: #252a37;
      --text: #e8ebf2;
      --dim: #8a92a6;
      --faint: #5b6378;
      --green: #3ddc97;
      --red: #ff5d6c;
      --blue: #5aa9ff;
      --amber: #ffb547;
      --violet: #a98bff;
      --gold: #ffd166;
      --A: #5aa9ff;
      --B: #a98bff;
      --C: #3ddc97;
      --D: #ff8f5a;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "Inter", system-ui, sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(1200px 600px at 70% -10%, #1b2440 0%, transparent
        60%), radial-gradient(900px 500px at -10% 110%, #1a1530 0%, transparent
        60%);
      pointer-events: none;
    }
    #stage {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: 88px 1fr 112px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 36px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }
    .brand {
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -.01em;
      white-space: nowrap;
    }
    .brand span {
      color: var(--dim);
      font-weight: 500;
      margin-left: 10px;
      font-size: 16px;
    }
    .scene {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--faint);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .step i {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1.5px solid var(--line);
      display: grid;
      place-items: center;
      font-style: normal;
      font-size: 12px;
    }
    .step.on {
      color: var(--text);
    }
    .step.on i {
      border-color: var(--blue);
      background: var(--blue);
      color: #08101f;
    }
    .step.done {
      color: var(--dim);
    }
    .step.done i {
      border-color: var(--green);
      color: var(--green);
    }
    .sep {
      width: 22px;
      height: 1.5px;
      background: var(--line);
    }
    .clock {
      font-family: var(--mono);
      font-size: 18px;
      color: var(--dim);
      white-space: nowrap;
    }
    .speed {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      white-space: nowrap;
      min-width: 150px;
      text-align: center;
    }
    .speed.slow {
      color: var(--violet);
      border-color: var(--violet);
    }
    .speed.fast {
      color: var(--amber);
      border-color: var(--amber);
    }
    .speed.live {
      color: var(--green);
      border-color: var(--green);
    }
    main {
      display: grid;
      grid-template-columns: 430px minmax(0, 1fr);
      gap: 22px;
      padding: 22px 36px 0;
      min-height: 0;
    }
    .rail {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
    }
    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--faint);
      font-weight: 700;
    }
    #tree svg {
      width: 100%;
      height: 250px;
      display: block;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      transition: none;
    }
    .stat .v {
      font-family: var(--mono);
      font-size: 27px;
      font-weight: 600;
      margin-top: 4px;
      white-space: nowrap;
    }
    .stat .s {
      color: var(--dim);
      font-size: 12.5px;
      margin-top: 2px;
    }
    .stat.hot {
      border-color: var(--blue);
      box-shadow: 0 0 0 1px var(--blue), 0 0 30px -6px var(--blue);
    }
    #security {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sec {
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.35;
      display: flex;
      gap: 10px;
    }
    .sec b {
      font-weight: 600;
      min-width: 62px;
    }
    .sec .ok {
      color: var(--green);
    }
    .sec .no {
      color: var(--red);
    }
    .sec .inj {
      color: var(--amber);
    }
    .sec span {
      color: var(--dim);
    }
    #work {
      position: relative;
      min-height: 0;
    }
    #solo {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
      gap: 18px;
    }
    .browser {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .urlbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      background: var(--panel2);
      border-bottom: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
    }
    .urlbar .dots {
      display: flex;
      gap: 5px;
    }
    .urlbar .dots i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--line);
    }
    .urlbar .live {
      margin-left: auto;
      color: var(--green);
      font-size: 11px;
      font-weight: 600;
    }
    .shot {
      flex: 1;
      min-height: 0;
      background: #f6f4ef center top / contain no-repeat;
      position: relative;
    }
    .terminal {
      background: #07090d;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      font-family: var(--mono);
      font-size: 15px;
      line-height: 1.55;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .terminal .p {
      color: var(--green);
    }
    .terminal .o {
      color: var(--dim);
      white-space: pre;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .terminal .c {
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-all;
    }
    #lanes {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
    }
    #lanes > div {
      min-width: 0;
      min-height: 0;
    }
    .lane {
      min-width: 0;
      background: var(--panel);
      border: 1.5px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    .lane .top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chip {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 17px;
      color: #0b0d12;
    }
    .lane .name {
      font-weight: 700;
      font-size: 18px;
    }
    .lane .approach {
      color: var(--dim);
      font-size: 15px;
    }
    .pill {
      margin-left: auto;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      white-space: nowrap;
      font-family: var(--mono);
    }
    .pill.thinking {
      color: var(--violet);
      border-color: var(--violet);
    }
    .pill.running {
      color: var(--blue);
      border-color: var(--blue);
    }
    .pill.testing {
      color: var(--amber);
      border-color: var(--amber);
    }
    .pill.winner {
      color: #0b0d12;
      background: var(--gold);
      border-color: var(--gold);
    }
    .pill.green {
      color: #0b0d12;
      background: var(--green);
      border-color: var(--green);
    }
    .bcheck {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .bcheck.ok {
      color: var(--green);
      background: rgba(61,220,151,.12);
    }
    .bcheck.no {
      color: var(--red);
      background: rgba(255,93,108,.12);
    }
    .review {
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.4;
      padding: 6px 9px;
      border-radius: 8px;
    }
    .review.ok {
      color: var(--green);
      background: rgba(61,220,151,.08);
    }
    .review.no {
      color: #ffb3ba;
      background: rgba(255,93,108,.08);
    }
    .lane .shot {
      background-size: 205% auto;
      background-position: 100% 9%;
    }
    .pill.dead {
      color: var(--red);
      border-color: var(--red);
    }
    .pill.paused {
      color: var(--blue);
      border-color: var(--blue);
      background: #12203a;
    }
    .lane .body {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 12px;
      min-height: 0;
    }
    .lane .browser {
      border-radius: 10px;
    }
    .lane .urlbar {
      padding: 6px 9px;
      font-size: 11px;
    }
    .feed {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-height: 0;
      overflow: hidden;
    }
    .intent {
      font-size: 15.5px;
      line-height: 1.38;
      color: var(--text);
      border-left: 3px solid var(--violet);
      padding: 2px 0 2px 10px;
      font-style: italic;
      min-height: 46px;
    }
    .intent .caret {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: var(--violet);
      vertical-align: -2px;
      margin-left: 2px;
    }
    .act {
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.35;
      display: flex;
      gap: 8px;
      align-items: baseline;
    }
    .act .k {
      width: 14px;
      flex: none;
      text-align: center;
      font-weight: 700;
    }
    .act .k.ok {
      color: var(--green);
    }
    .act .k.no {
      color: var(--red);
    }
    .act .k.run {
      color: var(--blue);
    }
    .act .x {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .act .x small {
      display: block;
      color: var(--faint);
      font-size: 11.5px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .act .ms {
      color: var(--faint);
      font-size: 11.5px;
    }
    .lane .bottom {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tests {
      display: flex;
      gap: 4px;
      flex: 1;
    }
    .tests i {
      flex: 1;
      height: 9px;
      border-radius: 3px;
      background: var(--line);
    }
    .tests i.p {
      background: var(--green);
    }
    .tests i.f {
      background: #4a2430;
    }
    .score {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 15px;
      min-width: 46px;
      text-align: right;
    }
    .files {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 48%;
    }
    .files b {
      color: var(--green);
      font-weight: 600;
    }
    .files em {
      color: var(--red);
      font-style: normal;
    }
    .stamp {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(11, 13, 18, .72);
      font-weight: 800;
      font-size: 30px;
      letter-spacing: .04em;
      color: var(--red);
      text-align: center;
    }
    .stamp small {
      display: block;
      font-family: var(--mono);
      font-weight: 600;
      font-size: 15px;
      color: var(--dim);
      letter-spacing: 0;
      margin-top: 8px;
    }
    .banner {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px 18px;
      font-weight: 700;
      font-size: 20px;
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .banner small {
      font-family: var(--mono);
      font-weight: 600;
      font-size: 14px;
      color: var(--dim);
    }
    footer {
      display: flex;
      align-items: center;
      padding: 0 36px;
      gap: 26px;
    }
    .caption {
      flex: 1;
    }
    .caption h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .caption p {
      margin: 6px 0 0;
      font-size: 19px;
      color: var(--dim);
    }
    .caption p b {
      color: var(--text);
      font-weight: 600;
    }
    .meter {
      text-align: right;
      font-family: var(--mono);
    }
    .meter .v {
      font-size: 30px;
      font-weight: 600;
    }
    .meter .s {
      color: var(--dim);
      font-size: 13px;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(8, 10, 14, .93);
    }
    .title {
      text-align: center;
    }
    .title .kicker {
      font-family: var(--mono);
      color: var(--blue);
      font-size: 20px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .title h1 {
      font-size: 112px;
      margin: 18px 0 10px;
      letter-spacing: -.04em;
      font-weight: 800;
      line-height: 1;
    }
    .title p {
      font-size: 28px;
      color: var(--dim);
      margin: 0;
    }
    .title .facts {
      display: flex;
      gap: 22px;
      justify-content: center;
      margin-top: 46px;
    }
    .title .facts div {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 26px;
      min-width: 230px;
    }
    .title .facts b {
      display: block;
      font-family: var(--mono);
      font-size: 40px;
    }
    .title .facts span {
      color: var(--dim);
      font-size: 16px;
    }
    .bill {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 34px 44px;
      min-width: 980px;
    }
    .bill h2 {
      margin: 0 0 22px;
      font-size: 40px;
      letter-spacing: -.02em;
    }
    .bill .rows {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .bill .rows div {
      background: var(--panel2);
      border-radius: 14px;
      padding: 18px 20px;
    }
    .bill .rows b {
      display: block;
      font-family: var(--mono);
      font-size: 36px;
      margin-top: 6px;
    }
    .bill .rows span {
      color: var(--dim);
      font-size: 15px;
    }
    .bill .total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .bill .total b {
      font-family: var(--mono);
      font-size: 56px;
      color: var(--green);
    }
    .bill .total span {
      color: var(--dim);
      font-size: 16px;
      max-width: 520px;
    }
    </style>
  </head>
  <body>
    <div id="stage">
      <header>
        <div
          class="brand">◆ machine slop<span>a computer for agents</span></div>
        <div class="scene" id="steps"></div>
        <div class="clock" id="clock"></div>
        <div class="speed" id="speed"></div>
      </header>
      <main>
        <div class="rail">
          <div class="card" id="tree">
            <div class="label">Machines</div>
            <svg viewBox="0 0 400 250" id="treesvg"></svg>
          </div>
          <div class="stats" id="stats"></div>
          <div class="card" id="security">
            <div class="label">Egress gateway</div>
            <div id="seclist"></div>
          </div>
        </div>
        <div id="work">
          <div id="solo">
            <div class="browser">
              <div
                class="urlbar"><span class="dots"><i></i><i></i><i></i></span><span id="solourl"></span><span class="live">● LIVE PREVIEW</span></div>
              <div class="shot" id="soloshot"></div>
            </div>
            <div class="terminal" id="soloterm"></div>
          </div>
          <div id="lanes"></div>
        </div>
      </main>
      <footer>
        <div class="caption">
          <h1 id="caph"></h1>
          <p id="capp"></p>
        </div>
        <div class="meter">
          <div class="v" id="meterv"></div>
          <div class="s" id="meters"></div>
        </div>
      </footer>
    </div>
    <div id="overlay"></div>
    <script>
    const RUN = window.RUN;
    const E = RUN.events;
    const byType = (type) => E.filter((e) => e.type === type);
    const first = (pred) => E.find(pred);
    const runInfo = first((e) => e.type === "run");
    const LANES = runInfo.lanes;
    const sceneAt = (id) =>
      first((e) => e.type === "scene" && e.id === id)?.t ?? Infinity;
    const winnerEvent = first((e) => e.type === "winner");
    const winner = winnerEvent?.lane ?? null;
    const N = first((e) => e.type === "tests")?.results.length ?? 9;
    const fmtMs = (ms) =>
      ms < 1000
        ? `${Math.round(ms)} ms`
        : `${(ms / 1000).toFixed(ms < 10000 ? 2 : 1)} s`;
    const fmtClock = (ms) => {
      const s = Math.max(0, Math.floor(ms / 1000));
      return `T+${String(Math.floor(s / 60)).padStart(2, "0")}:${
        String(s % 60).padStart(2, "0")
      }`;
    };
    const esc = (s) =>
      String(s ?? "").replace(
        /[&<>"]/g,
        (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
      );
    const upto = (t, pred) => E.filter((e) => e.t <= t && pred(e));
    const last = (t, pred) => {
      let found = null;
      for (const e of E) {
        if (e.t > t) break;
        if (pred(e)) found = e;
      }
      return found;
    };
    const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);

    const STEPS = [
      ["boot", "Boot"],
      ["setup", "Set up"],
      ["secrets", "Secrets"],
      ["snapshot", "Snapshot"],
      ["fork", "Fork ×4"],
      ["race", "Race"],
      ["pick", "Pick"],
      ["pause", "Pause"],
      ["bill", "Bill"],
    ];

    const facts = (() => {
      const tmpl = first((e) =>
        e.type === "machine" && e.lane === "template" && e.state === "running"
      );
      const snap = first((e) => e.type === "snapshot");
      const fork = first((e) => e.type === "fork");
      const dev = byType("dev");
      const base = first((e) => e.type === "usage_base");
      return { tmpl, snap, fork, dev, base };
    })();

    function sceneOf(t) {
      let cur = "boot";
      for (const [id] of STEPS) if (sceneAt(id) <= t) cur = id;
      return cur;
    }

    function captions(scene, t) {
      const f = facts;
      const pid = f.dev.find((d) => d.lane === "template")?.pid;
      switch (scene) {
        case "boot":
          return [
            "Boot a microVM",
            `Firecracker, jailed · 2 vCPU · ${runInfo.memory_mib} MiB · no network interface · <b>${
              fmtMs(f.tmpl?.boot_ms ?? 0)
            }</b> cold boot`,
          ];
        case "setup": {
          const up = first((e) => e.type === "upload");
          return [
            "Ship the app, start the dev server",
            `${up?.files ?? 7} files in <b>one request</b> (${
              fmtMs(up?.ms ?? 0)
            }) · dev server live at a public preview URL`,
          ];
        }
        case "secrets":
          return [
            "Secrets never enter the machine",
            `The host's egress gateway adds the API key on the way out · <b>env</b> in the VM has nothing to steal · hosts off the allowlist get <b>403</b>`,
          ];
        case "snapshot":
          return [
            "Snapshot the running computer",
            `Memory + disk, dev server mid-flight · <b>${
              fmtMs(f.snap?.ms ?? 0)
            }</b> · template parked: paused, zero RAM`,
          ];
        case "fork":
          return [
            "Fork it into four",
            `4 machines from one snapshot in <b>${
              fmtMs(f.fork?.ms ?? 0)
            }</b> · same process (PID ${pid}) running in every copy`,
          ];
        case "race":
          return [
            "Four models, four approaches, four computers",
            `Each agent gets its own forked machine · a reviewer checks every live preview in a real browser`,
          ];
        case "pick": {
          const w = LANES.find((l) => l.id === winner);
          return [
            winner ? `${w.name} wins: ${w.approach}` : "No winner",
            `First to ${N}/${N} tests and a passing browser check, <b>${
              fmtMs(winnerEvent?.ms ?? 0)
            }</b> into the race · the other three machines are destroyed`,
          ];
        }
        case "pause":
          return [
            "Pause it. Resume it. Nothing lost.",
            `Memory saved to disk, RAM freed · resume brings back the same running dev server`,
          ];
        case "bill":
          return [
            "Every second metered",
            `Per-tenant usage from machined · vCPU time, memory, snapshot storage`,
          ];
      }
      return ["", ""];
    }

    function usageDelta(t) {
      const u = last(t, (e) => e.type === "usage");
      const b = facts.base;
      if (!u || !b) return null;
      const vcpu = (u.vcpu_ms - b.vcpu_ms) / 1000;
      const mem = (u.memory_mib_ms - b.memory_mib_ms) / 1000 / 1024;
      const snap = (u.snapshot_mib_ms - b.snapshot_mib_ms) / 1000 / 1024;
      const dollars = vcpu / 3600 * 0.0504 + mem / 3600 * 0.0162 +
        snap / 3600 * 0.000108;
      return { vcpu, mem, snap, dollars };
    }

    function laneState(id, t) {
      const destroyed = last(
        t,
        (e) => e.type === "machine" && e.lane === id && e.state === "destroyed",
      );
      const paused = last(
        t,
        (e) =>
          e.type === "machine" && e.lane === id &&
          (e.state === "paused" || e.state === "running"),
      );
      const isWinner = winner === id && winnerEvent.t <= t;
      const status = last(t, (e) => e.type === "status" && e.lane === id);
      const intent = last(t, (e) => e.type === "intent" && e.lane === id);
      const tests = last(t, (e) => e.type === "tests" && e.lane === id);
      const diff = last(t, (e) => e.type === "diff" && e.lane === id);
      const shot = last(t, (e) => e.type === "shot" && e.lane === id);
      const preview = last(t, (e) => e.type === "preview" && e.lane === id);
      const cmds = upto(t, (e) => e.type === "command" && e.lane === id);
      const browser = last(t, (e) => e.type === "browser" && e.lane === id);
      const green = last(t, (e) => e.type === "green" && e.lane === id);
      return {
        destroyed,
        paused,
        isWinner,
        status,
        intent,
        tests,
        diff,
        shot,
        preview,
        cmds,
        browser,
        green,
      };
    }

    function pillFor(s, t) {
      if (s.destroyed) return ["dead", "DESTROYED"];
      if (s.paused?.state === "paused") return ["paused", "⏸ PAUSED"];
      if (s.isWinner) return ["winner", "★ FIRST GREEN"];
      if (s.green) return ["green", "✓ GREEN"];
      if (!s.status) return ["", "ready"];
      const dots = ".".repeat(1 + Math.floor(t / 400) % 3);
      if (s.status.status === "thinking") return ["thinking", `thinking${dots}`];
      if (s.status.status === "running") return ["running", "running"];
      if (s.status.status === "testing") return ["testing", "testing"];
      return ["", s.status.status];
    }

    function renderLane(lane, t, vt) {
      const s = laneState(lane.id, t);
      const [cls, text] = pillFor(s, vt);
      const typed = s.intent
        ? (() => {
          const n = Math.floor((vt - s.intent.vt) / 22);
          return s.intent.text.slice(0, Math.max(0, n));
        })()
        : "";
      const typing = s.intent && typed.length < s.intent.text.length;
      const running = s.status?.status === "running" &&
        (!s.cmds.length || s.cmds[s.cmds.length - 1].t < s.status.t);
      const acts = s.cmds.slice(-5).map((c) => {
        const ok = c.exit_code === 0;
        const k = ok ? "✓" : "✗";
        const line = c.cmd.split("\n")[0];
        const out = (c.output || []).slice(-1)[0] || "";
        return `<div class="act"><span class="k ${
          ok ? "ok" : "no"
        }">${k}</span><span class="x">${esc(line)}<small>${
          esc(out)
        }</small></span><span class="ms">${fmtMs(c.ms)}</span></div>`;
      });
      if (
        s.browser && (!s.cmds.length || s.browser.t > s.cmds[s.cmds.length - 1].t)
      ) {
        acts.push(
          `<div class="review ${s.browser.ok ? "ok" : "no"}">${
            s.browser.ok ? "✓" : "✗"
          } reviewer typed SAVE20: ${
            esc(
              s.browser.seen.replace(/#total shows /, "total ").replace(
                / and #discount-line shows /,
                ", discount ",
              ),
            )
          }</div>`,
        );
      }
      if (running) {
        acts.push(
          `<div class="act"><span class="k run">›</span><span class="x">${
            esc(s.status.detail)
          }</span><span class="ms">…</span></div>`,
        );
      }
      const results = s.tests?.results ?? [];
      const tests = Array.from(
        { length: N },
        (_, i) => `<i class="${s.tests ? (results[i] ? "p" : "f") : ""}"></i>`,
      ).join("");
      const files = (s.diff?.files ?? []).map((f) =>
        `${esc(f.path)} <b>+${f.added}</b> <em>−${f.removed}</em>`
      ).join(" · ");
      const color = `var(--${lane.id})`;
      const border = s.isWinner
        ? "var(--gold)"
        : s.destroyed
        ? "#3a2027"
        : "var(--line)";
      const glow = s.isWinner
        ? "box-shadow: 0 0 0 1px var(--gold), 0 0 50px -10px var(--gold);"
        : "";
      let stamp = "";
      if (s.destroyed) {
        stamp = `<div class="stamp"><div>✕ DESTROYED<small>machine removed in ${
          fmtMs(s.destroyed.ms)
        } · ${s.tests?.passed ?? 0}/${N} tests${
          s.green ? ", green " + fmtMs(s.green.ms) + " in" : ""
        }</small></div></div>`;
      }
      return `<div class="lane" style="border-color:${border};${glow}">
        <div class="top"><div class="chip" style="background:${color}">${lane.id}</div><div><div class="name">${
        esc(lane.name)
      }</div><div class="approach">${
        esc(lane.approach)
      }</div></div><div class="pill ${cls}">${text}</div></div>
        <div class="body">
          <div class="browser"><div class="urlbar"><span class="dots"><i></i><i></i><i></i></span><span>${
        esc((s.preview?.url ?? "").replace("http://", "").slice(0, 14))
      }….preview</span></div><div class="shot" style="background-image:url('${
        s.shot?.file ?? ""
      }')"></div></div>
          <div class="feed"><div class="intent">${
        s.intent
          ? `“${esc(typed)}${typing ? '<span class="caret"></span>' : "”"}`
          : '<span style="color:var(--faint)">waiting for the model…</span>'
      }</div>${acts.join("")}</div>
        </div>
        <div class="bottom"><div class="tests">${tests}</div><div class="score" style="color:${
        (s.tests?.passed ?? 0) === N ? "var(--green)" : "var(--text)"
      }">${s.tests?.passed ?? 0}/${N}</div>${
        s.browser
          ? `<div class="bcheck ${s.browser.ok ? "ok" : "no"}">${
            s.browser.ok ? "✓" : "✗"
          } browser</div>`
          : ""
      }<div class="files">${
        files || '<span style="color:var(--faint)">no changes yet</span>'
      }</div></div>
        ${stamp}
      </div>`;
    }

    function renderWinnerFocus(t, vt) {
      const lane = LANES.find((l) => l.id === winner);
      const s = laneState(winner, t);
      const pauseEvt = last(
        t,
        (e) => e.type === "machine" && e.lane === winner && e.state === "paused",
      );
      const resumeEvt = last(
        t,
        (e) => e.type === "machine" && e.lane === winner && e.resumed,
      );
      const devs = upto(t, (e) => e.type === "dev" && e.lane === winner);
      const devBefore = devs.find((d) => d.t >= sceneAt("pause"));
      const devAfter = resumeEvt ? devs.filter((d) => d.t > resumeEvt.t)[0] : null;
      let banner = "";
      if (resumeEvt && devAfter) {
        banner =
          `<div class="banner" style="background:rgba(61,220,151,.14);color:var(--green)">▶ Resumed in ${
            fmtMs(resumeEvt.ms)
          }<small>dev server PID ${devAfter.pid} · uptime ${
            fmtMs(devBefore?.uptime_ms ?? 0)
          } → ${
            fmtMs(devAfter.uptime_ms)
          } · same process, never restarted</small></div>`;
      } else if (resumeEvt) {
        banner =
          `<div class="banner" style="background:rgba(61,220,151,.14);color:var(--green)">▶ Resumed in ${
            fmtMs(resumeEvt.ms)
          }</div>`;
      } else if (pauseEvt) {
        banner =
          `<div class="banner" style="background:rgba(90,169,255,.16);color:var(--blue)">⏸ Paused in ${
            fmtMs(pauseEvt.ms)
          }<small>memory + disk saved · VM stopped · 0 MiB RAM held · preview answers 503</small></div>`;
      }
      return `<div class="browser" style="height:100%;border:1.5px solid var(--gold);box-shadow:0 0 60px -12px var(--gold)"><div class="urlbar"><span class="dots"><i></i><i></i><i></i></span><span>${
        esc(s.preview?.url ?? "")
      }</span><span class="live">${lane.name} · ${lane.approach} · ${s.tests?.passed}/${N} tests · browser check ✓</span></div><div class="shot" style="background-image:url('${
        s.shot?.file ?? ""
      }');background-size:contain;background-color:#f6f4ef">${banner}</div></div>`;
    }

    function renderTree(t) {
      const tmpl = last(t, (e) => e.type === "machine" && e.lane === "template");
      const snap = last(t, (e) => e.type === "snapshot");
      const nodes = [];
      const lines = [];
      const tx = 52, ty = 125, sx = 175, sy = 125;
      const stateColor = (state) =>
        state === "paused"
          ? "var(--blue)"
          : state === "destroyed"
          ? "#3a2027"
          : "var(--green)";
      if (tmpl) {
        nodes.push(
          `<circle cx="${tx}" cy="${ty}" r="22" fill="${
            stateColor(tmpl.state)
          }" opacity="${tmpl.state === "paused" ? .55 : 1}"/><text x="${tx}" y="${
            ty + 5
          }" text-anchor="middle" font-size="15" font-weight="800" fill="#0b0d12">T</text><text x="${tx}" y="${
            ty + 44
          }" text-anchor="middle" font-size="12" fill="var(--dim)">template</text><text x="${tx}" y="${
            ty + 59
          }" text-anchor="middle" font-size="11" fill="var(--faint)">${tmpl.state}</text>`,
        );
      }
      if (snap) {
        const p = ease((t - snap.t) / 500);
        lines.push(
          `<line x1="${tx + 22}" y1="${ty}" x2="${
            tx + 22 + (sx - tx - 40) * p
          }" y2="${sy}" stroke="var(--line)" stroke-width="2"/>`,
        );
        if (p > .9) {
          nodes.push(
            `<rect x="${sx - 18}" y="${
              sy - 18
            }" width="36" height="36" rx="8" fill="var(--violet)"/><text x="${sx}" y="${
              sy + 5
            }" text-anchor="middle" font-size="14" font-weight="800" fill="#0b0d12">S</text><text x="${sx}" y="${
              sy + 40
            }" text-anchor="middle" font-size="12" fill="var(--dim)">snapshot</text><text x="${sx}" y="${
              sy + 55
            }" text-anchor="middle" font-size="11" fill="var(--faint)">${
              (snap.stored_bytes / 1048576).toFixed(0)
            } MiB</text>`,
          );
        }
      }
      LANES.forEach((lane, i) => {
        const m = first((e) => e.type === "machine" && e.lane === lane.id);
        if (!m || m.t > t + 0) return;
        const cy = 30 + i * 63, cx = 330;
        const p = ease((t - (sceneAt("fork"))) / Math.max(1, m.ms));
        const st = last(t, (e) => e.type === "machine" && e.lane === lane.id);
        const dead = st?.state === "destroyed";
        const won = winner === lane.id && winnerEvent.t <= t;
        lines.push(
          `<path d="M${sx + 18} ${sy} C ${sx + 80} ${sy}, ${cx - 80} ${cy}, ${
            cx - 20
          } ${cy}" stroke="${
            dead ? "#2a1e24" : `var(--${lane.id})`
          }" stroke-width="2.5" fill="none" opacity="${
            dead ? .5 : .9
          }" stroke-dasharray="300" stroke-dashoffset="${300 * (1 - p)}"/>`,
        );
        nodes.push(
          `<circle cx="${cx}" cy="${cy}" r="${won ? 20 : 17}" fill="${
            dead ? "#2a1e24" : `var(--${lane.id})`
          }" ${
            won ? 'stroke="var(--gold)" stroke-width="4"' : ""
          }/><text x="${cx}" y="${
            cy + 5
          }" text-anchor="middle" font-size="14" font-weight="800" fill="${
            dead ? "var(--red)" : "#0b0d12"
          }">${dead ? "✕" : lane.id}</text><text x="${cx + 26}" y="${
            cy + 4
          }" font-size="12" font-family="var(--mono)" fill="var(--dim)">${
            fmtMs(m.ms)
          }</text>`,
        );
      });
      document.getElementById("treesvg").innerHTML = lines.join("") +
        nodes.join("");
    }

    function stat(v, label, sub, hot) {
      return `<div class="stat ${
        hot ? "hot" : ""
      }"><div class="label">${label}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
    }

    function renderStats(t, scene) {
      const f = facts;
      const cmds =
        upto(t, (e) => e.type === "command" && e.lane !== "template").length;
      const denies = EGRESS.filter((e) => e.t <= t && e.verdict === "deny").length;
      const forkDone = f.fork && f.fork.t <= t;
      const snapDone = f.snap && f.snap.t <= t;
      const bootDone = f.tmpl && f.tmpl.t <= t;
      const turns = upto(t, (e) => e.type === "intent").length;
      document.getElementById("stats").innerHTML = [
        stat(
          bootDone ? fmtMs(f.tmpl.boot_ms) : "—",
          "Cold boot",
          "template microVM",
          scene === "boot",
        ),
        stat(
          snapDone ? fmtMs(f.snap.ms) : "—",
          "Snapshot",
          snapDone
            ? `${(f.snap.stored_bytes / 1048576).toFixed(0)} MiB memory + disk`
            : "running machine",
          scene === "snapshot",
        ),
        stat(
          forkDone ? fmtMs(f.fork.ms) : "—",
          "Fork ×4",
          "machines from one snapshot",
          scene === "fork",
        ),
        stat(
          cmds || "—",
          "Commands",
          `${turns} model turns`,
          scene === "race" && false,
        ),
        stat(
          denies,
          "Egress denied",
          "hosts outside the allowlist",
          denies > 0 && scene === "secrets",
        ),
        stat(
          winnerEvent && winnerEvent.t <= t ? fmtMs(winnerEvent.ms) : "—",
          "Time to green",
          "first agent fully green",
          scene === "pick",
        ),
      ].join("");
    }

    const EGRESS = (() => {
      const seen = new Set();
      const items = [];
      for (const e of E) {
        if (e.type === "egress") {
          const key = `${e.lane}|${e.host}|${e.verdict}`;
          if (!seen.has(key)) {
            seen.add(key);
            items.push(e);
          }
        } else if (
          e.type === "command" &&
          /response 403|E403|403 Forbidden/.test((e.output || []).join("\n"))
        ) {
          const hosts = `${e.cmd}\n${(e.output || []).join("\n")}`.match(
            /\b(?:[a-z0-9-]+\.)+(?:org|com|net|io|dev|app)\b/g,
          ) ?? [];
          for (const host of hosts) {
            const key = `${e.lane}|${host}|deny`;
            if (seen.has(key)) continue;
            seen.add(key);
            items.push({
              t: e.t,
              type: "egress",
              lane: e.lane,
              verdict: "deny",
              host,
              detail: "refused: not on this machine's allowlist",
            });
          }
        }
      }
      return items.sort((a, b) => a.t - b.t);
    })();

    function renderSecurity(t) {
      const items = EGRESS.filter((e) => e.t <= t).slice(-7).reverse();
      document.getElementById("seclist").innerHTML = items.map((e) => {
        const tag = e.verdict === "inject"
          ? ["inj", "INJECT"]
          : e.verdict === "deny"
          ? ["no", "DENY"]
          : ["ok", "ALLOW"];
        const who = e.lane === "template" ? "T" : e.lane;
        return `<div class="sec"><b class="${tag[0]}">${tag[1]}</b><div>${who} → ${
          esc(e.host)
        }:443<br><span>${esc(e.detail)}</span></div></div>`;
      }).join("") ||
        `<div class="sec"><span>machines have no network interface; the host proxies HTTPS to an allowlist</span></div>`;
    }

    function renderSolo(t, vt) {
      const shot = last(t, (e) => e.type === "shot" && e.lane === "template");
      const preview = last(t, (e) => e.type === "preview" && e.lane === "template");
      document.getElementById("soloshot").style.backgroundImage = shot
        ? `url('${shot.file}')`
        : "none";
      document.getElementById("solourl").textContent = preview
        ? preview.url
        : "waiting for the dev server…";
      const cmds = upto(t, (e) => e.type === "command" && e.lane === "template");
      const status = last(t, (e) => e.type === "status" && e.lane === "template");
      const lines = [];
      const tmpl = last(t, (e) => e.type === "machine" && e.lane === "template");
      lines.push(
        `<div class="o">machine ${tmpl ? tmpl.id.slice(0, 12) : "…"} · ${
          tmpl ? tmpl.state : "booting"
        }</div>`,
      );
      const entries = upto(
        t,
        (e) =>
          e.lane === "template" &&
            ["upload", "command", "tests"].includes(e.type) ||
          e.type === "snapshot" ||
          (e.type === "machine" && e.lane === "template" && e.state === "paused"),
      );
      for (const e of entries) {
        if (e.type === "upload") {
          lines.push(
            `<div><span class="p">❯</span> <span class="c">writeArchive /workspace/app (${e.files} files, ${
              (e.bytes / 1024).toFixed(1)
            } KiB)</span></div><div class="o">done in ${fmtMs(e.ms)}</div>`,
          );
        }
        if (e.type === "command") {
          lines.push(
            `<div><span class="p">❯</span> <span class="c">${
              esc(e.cmd.length > 140 ? e.cmd.slice(0, 139) + "…" : e.cmd)
            }</span></div>`,
          );
          for (const o of (e.output || []).slice(-3)) {
            lines.push(
              `<div class="o" style="${
                /403/.test(o)
                  ? "color:var(--red)"
                  : /sk-demo/.test(o)
                  ? "color:var(--amber)"
                  : ""
              }">${esc(o)}</div>`,
            );
          }
        }
        if (e.type === "tests") {
          lines.push(
            `<div><span class="p">❯</span> <span class="c">npm test</span></div><div class="o" style="color:var(--amber)">${e.passed}/${N} passing · discount codes not built yet</div>`,
          );
        }
        if (e.type === "snapshot") {
          lines.push(
            `<div><span class="p">❯</span> <span class="c">machine.snapshot()</span></div><div class="o" style="color:var(--violet)">snapshot ${
              e.id.slice(0, 12)
            } · ${(e.stored_bytes / 1048576).toFixed(0)} MiB · ${
              fmtMs(e.ms)
            }</div>`,
          );
        }
        if (e.type === "machine") {
          lines.push(
            `<div><span class="p">❯</span> <span class="c">machine.pause()</span></div><div class="o" style="color:var(--blue)">paused in ${
              fmtMs(e.ms)
            } · VM stopped, RAM freed</div>`,
          );
        }
      }
      if (status && (!cmds.length || cmds[cmds.length - 1].t < status.t)) {
        lines.push(
          `<div><span class="p">❯</span> <span class="c">${
            esc(status.detail)
          }</span><span class="caret" style="display:inline-block;width:9px;height:17px;background:var(--green);vertical-align:-3px;opacity:${
            Math.floor(vt / 500) % 2
          }"></span></div>`,
        );
      }
      document.getElementById("soloterm").innerHTML = lines.slice(-22).join("");
    }

    function renderOverlay(kind, vt) {
      const o = document.getElementById("overlay");
      if (!kind) {
        o.style.display = "none";
        return;
      }
      o.style.display = "grid";
      const f = facts;
      if (kind === "intro") {
        o.innerHTML =
          `<div class="title"><div class="kicker">machine slop · real run, nothing simulated</div><h1>Fork the agent</h1><p>One running computer becomes four. Four Claude models race. The first fully green one wins.</p><div class="facts"><div><b>${
            fmtMs(f.fork.ms)
          }</b><span>4 machines from a live snapshot</span></div><div><b>4</b><span>Claude models racing in parallel</span></div><div><b>0</b><span>secrets inside any machine</span></div></div></div>`;
      } else if (kind === "bill") {
        const u = usageDelta(Infinity);
        const cmds = byType("command").filter((e) => e.lane !== "template").length;

        o.innerHTML =
          `<div class="bill"><div class="label">Tenant usage for this whole demo · from machined</div><h2>5 machines · ${turns} model turns · ${cmds} commands · 1 winner</h2><div class="rows"><div><span>vCPU time</span><b>${
            u.vcpu.toFixed(0)
          } s</b></div><div><span>Memory</span><b>${
            u.mem.toFixed(0)
          } GiB·s</b></div><div><span>Snapshot storage</span><b>${
            u.snap.toFixed(1)
          } GiB·s</b></div></div><div class="total"><span>Priced at typical hosted-sandbox list rates ($0.0504 per vCPU-hour, $0.0162 per GiB-hour)</span><b>$${
            u.dollars.toFixed(4)
          }</b></div></div>`;
      } else if (kind === "end") {
        const w = LANES.find((l) => l.id === winner);
        o.innerHTML =
          `<div class="title"><div class="kicker">recap</div><h1 style="font-size:84px">${
            fmtMs(f.fork.ms)
          } to fork. ${
            fmtMs(winnerEvent?.ms ?? 0)
          } to green.</h1><p>Snapshots with live memory · forks · previews · egress with injected credentials · pause/resume · metering</p><div class="facts"><div><b>${
            fmtMs(f.tmpl.boot_ms)
          }</b><span>cold boot</span></div><div><b>${
            fmtMs(f.snap.ms)
          }</b><span>snapshot a running VM</span></div><div><b>${
            w ? w.name : "–"
          }</b><span>won · ${
            w ? w.approach.toLowerCase() : ""
          }</span></div><div><b>${
            fmtMs(first((e) => e.type === "machine" && e.resumed)?.ms ?? 0)
          }</b><span>resume with memory</span></div></div></div>`;
      }
    }

    window.renderAt = (t, vt, speed, overlay) => {
      const scene = sceneOf(t);
      const idx = STEPS.findIndex(([id]) => id === scene);
      document.getElementById("steps").innerHTML = STEPS.map(([id, name], i) =>
        `${i ? '<span class="sep"></span>' : ""}<span class="step ${
          i < idx ? "done" : i === idx ? "on" : ""
        }"><i>${i < idx ? "✓" : i + 1}</i>${name}</span>`
      ).join("");
      document.getElementById("clock").textContent = fmtClock(t);
      const sp = document.getElementById("speed");
      if (speed < 0.6) {
        sp.className = "speed slow";
        sp.textContent = `SLOW-MO ${
          speed < 0.1 ? (1 / speed).toFixed(0) : (1 / speed).toFixed(1)
        }×`;
      } else if (speed > 1.5) {
        sp.className = "speed fast";
        sp.textContent = `FAST-FORWARD ${speed.toFixed(0)}×`;
      } else {
        sp.className = "speed live";
        sp.textContent = "● REAL TIME";
      }
      const [h, p] = captions(scene, t);
      document.getElementById("caph").textContent = h;
      document.getElementById("capp").innerHTML = p;
      renderTree(t);
      renderStats(t, scene);
      renderSecurity(t);
      const solo = document.getElementById("solo");
      const lanes = document.getElementById("lanes");
      const forkT = sceneAt("fork");
      const firstChild = first((e) =>
        e.type === "machine" && e.lane === LANES[0].id
      );
      if (!firstChild || t < firstChild.t) {
        solo.style.display = "grid";
        solo.style.opacity = 1;
        lanes.style.display = "none";
        renderSolo(t, vt);
      } else if (scene === "pause" || (scene === "bill" && winner)) {
        solo.style.display = "none";
        lanes.style.display = "grid";
        lanes.style.gridTemplateColumns = "minmax(0, 1fr)";
        lanes.style.gridTemplateRows = "minmax(0, 1fr)";
        lanes.innerHTML = renderWinnerFocus(t, vt);
      } else {
        solo.style.display = "none";
        lanes.style.display = "grid";
        lanes.style.gridTemplateColumns = "minmax(0, 1fr) minmax(0, 1fr)";
        lanes.style.gridTemplateRows = "minmax(0, 1fr) minmax(0, 1fr)";
        lanes.innerHTML = LANES.map((lane) => {
          const m = first((e) => e.type === "machine" && e.lane === lane.id);
          if (!m || m.t > t) return `<div class="lane" style="opacity:.15"></div>`;
          const a = ease((vt - m.vt) / 450);
          return `<div style="opacity:${a};transform:scale(${
            0.92 + 0.08 * a
          });display:flex;min-height:0">${
            renderLane(lane, t, vt).replace(
              'class="lane"',
              'class="lane" style="flex:1"',
            )
          }</div>`;
        }).join("");
      }
      const u = usageDelta(t);
      const cmds = upto(t, (e) => e.type === "command").length;
      document.getElementById("meterv").textContent = u
        ? `$${u.dollars.toFixed(4)}`
        : `${cmds} cmds`;
      document.getElementById("meters").textContent = u
        ? `${u.vcpu.toFixed(0)} vCPU·s metered`
        : "commands run so far";
      renderOverlay(overlay, vt);
    };

    window.ready = (async () => {
      await document.fonts.ready;
      const files = [...new Set(byType("shot").map((e) => e.file))];
      await Promise.all(files.map((f) =>
        new Promise((res) => {
          const i = new Image();
          i.onload = i.onerror = res;
          i.src = f;
        })
      ));
      return files.length;
    })();
    </script>
  </body>
</html>
