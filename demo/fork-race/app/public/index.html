<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Slop Supply Co. · Checkout</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header><span class="logo">◆ Slop Supply Co.</span><span class="step">Checkout</span></header>
    <main>
      <section class="items" id="items"></section>
      <aside class="summary">
        <h2>Order summary</h2>
        <div class="row"><span>Subtotal</span><span id="subtotal">–</span></div>
        <div class="row"><span>Shipping</span><span id="shipping">–</span></div>
        <div class="row total"><span>Total</span><span id="total">–</span></div>
        <button id="place-order">Place order</button>
      </aside>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
